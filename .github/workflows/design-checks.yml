name: Design checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/game-posters-redesign]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-checks-and-screenshots
          path: test-results/
          retention-days: 7
